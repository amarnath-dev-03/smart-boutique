<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Boutique</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background: #f7f3f0;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            width: 350px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.12);
        }

        .login-box h2 {
            text-align: center;

            color: #5b3a29;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ddd;

            border-radius: 8px;

            box-sizing: border-box;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #5b3a29;

            box-shadow:
                0 0 0 3px rgba(91,58,41,0.08);
        }


        /* =========================
           PASSWORD FIELD
        ========================= */

        .password-wrapper {
            position: relative;

            width: 100%;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .eye-button {
            position: absolute;

            right: 10px;

            top: 50%;

            transform: translateY(-50%);

            width: 30px;

            height: 30px;

            background: transparent;

            color: #5b3a29;

            border: none;

            padding: 0;

            margin: 0;

            font-size: 18px;

            cursor: pointer;
        }

        .eye-button:hover {
            background: transparent;

            color: #452b1e;
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        button[type="submit"] {
            width: 100%;

            padding: 12px;

            background: #5b3a29;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;

            transition: 0.2s;
        }

        button[type="submit"]:hover {
            background: #452b1e;

            transform: translateY(-1px);
        }


        /* =========================
           FORGOT PASSWORD
        ========================= */

        .forgot-password {
            display: block;

            text-align: right;

            margin-top: -10px;

            margin-bottom: 20px;

            color: #5b3a29;

            text-decoration: none;

            font-size: 13px;

            font-weight: bold;

            transition: 0.2s;
        }

        .forgot-password:hover {
            color: #8b5d42;

            text-decoration: underline;
        }


        /* =========================
           ERROR
        ========================= */

        .error {
            color: #b3261e;

            background: #fff0ee;

            border-radius: 8px;

            padding: 10px;

            text-align: center;

            margin-bottom: 15px;

            font-size: 13px;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <h2>Smart Boutique</h2>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                autocomplete="username"
                required
            >


            <label>
                Password
            </label>


            <div class="password-wrapper">

                <input
                    type="password"
                    name="password"
                    id="password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="button"
                    class="eye-button"
                    id="eyeButton"
                    onclick="togglePassword()"
                    title="Show password"
                >
                    👁️
                </button>

            </div>


            <!-- Forgot Password -->

            <a
                href="{% url 'forgot_password' %}"
                class="forgot-password"
            >
                Forgot Password?
            </a>


            <button type="submit">
                Login
            </button>

        </form>

    </div>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const eyeButton =
                document.getElementById("eyeButton");


            if (password.type === "password") {

                password.type = "text";

                eyeButton.innerHTML = "🙈";

                eyeButton.title = "Hide password";

            } else {

                password.type = "password";

                eyeButton.innerHTML = "👁️";

                eyeButton.title = "Show password";

            }

        }

    </script>

</body>

</html>
