
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Smart Boutique</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f7f3f0 0%,
                    #eee4dc 100%
                );

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .reset-box {
            width: 390px;

            background: rgba(255, 255, 255, 0.97);

            padding: 42px 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(91, 58, 41, 0.15);

            text-align: center;

            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-circle {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            background: #f5eadf;

            border: 1px solid #e7c98a;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;

            color: #5b3a29;
        }

        h2 {
            margin: 0;

            color: #5b3a29;

            font-size: 27px;
        }

        .subtitle {
            margin-top: 10px;
            margin-bottom: 28px;

            color: #777;

            font-size: 14px;

            line-height: 1.6;
        }

        .form-group {
            text-align: left;

            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #3d3029;

            font-size: 14px;

            font-weight: bold;
        }

        .password-wrapper {
            position: relative;
        }

        input {
            width: 100%;

            padding: 13px 52px 13px 14px;

            border: 1px solid #ddd1c8;

            border-radius: 10px;

            background: white;

            color: #333;

            font-size: 15px;

            outline: none;

            transition: 0.25s ease;
        }

        input:focus {
            border-color: #5b3a29;

            box-shadow:
                0 0 0 3px rgba(91, 58, 41, 0.08);
        }

        input::placeholder {
            color: #aaa;
        }

        .eye-button {
            position: absolute;

            right: 8px;
            top: 50%;

            transform: translateY(-50%);

            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f7f3f0;

            color: #5b3a29;

            border: 1px solid #e5ddd7;

            border-radius: 50%;

            padding: 0;

            cursor: pointer;

            transition: all 0.25s ease;
        }

        .eye-button:hover {
            background: #5b3a29;

            color: white;

            border-color: #5b3a29;

            transform:
                translateY(-50%)
                scale(1.08);
        }

        .eye-button svg {
            width: 19px;
            height: 19px;

            fill: none;

            stroke: currentColor;

            stroke-width: 1.8;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .error {
            margin-bottom: 18px;

            padding: 10px;

            border-radius: 8px;

            background: #fff0ee;

            color: #b3261e;

            font-size: 13px;
        }

        .reset-btn {
            width: 100%;

            margin-top: 5px;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #5b3a29,
                    #704a35
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 6px 15px rgba(91, 58, 41, 0.18);

            transition: all 0.25s ease;
        }

        .reset-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 9px 20px rgba(91, 58, 41, 0.25);
        }

        .back-login {
            display: inline-block;

            margin-top: 24px;

            color: #5b3a29;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

            transition: 0.2s ease;
        }

        .back-login:hover {
            color: #8b5d42;
        }

        .footer-text {
            margin-top: 28px;

            padding-top: 18px;

            border-top: 1px solid #eee5df;

            color: #aaa;

            font-size: 11px;
        }

        @media (max-width: 450px) {

            .reset-box {
                width: 100%;

                padding: 35px 25px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="reset-box">

        <div class="icon-circle">
            🔐
        </div>

        <h2>Reset Password</h2>

        <div class="subtitle">
            Create a new password for your<br>
            Smart Boutique account.
        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        required
                    >

                    <button
                        type="button"
                        class="eye-button"
                        onclick="togglePassword('password', 'eye1')"
                        title="Show password"
                    >

                        <svg id="eye1" viewBox="0 0 24 24">
                            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>

                    </button>

                </div>

            </div>

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        required
                    >

                    <button
                        type="button"
                        class="eye-button"
                        onclick="togglePassword('confirm_password', 'eye2')"
                        title="Show password"
                    >

                        <svg id="eye2" viewBox="0 0 24 24">
                            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>

                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="reset-btn"
            >
                Reset Password
            </button>

        </form>

        <a
            href="{% url 'login' %}"
            class="back-login"
        >
            ← Back to Login
        </a>

        <div class="footer-text">
            Smart Boutique · Smart Tailoring & Boutique
        </div>

    </div>

    <script>
        function togglePassword(inputId, iconId) {

            const password =
                document.getElementById(inputId);

            const icon =
                document.getElementById(iconId);

            const button =
                icon.closest("button");

            if (password.type === "password") {

                password.type = "text";

                icon.innerHTML = `
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18.4 18.4 0 0 1-3.1 3.9"></path>
                    <path d="M6.1 6.1C3.5 8 2 12 2 12s3.5 7 10 7c1.9 0 3.5-.5 4.9-1.3"></path>
                    <path d="M9.9 9.9a3 3 0 1 0 4.2 4.2"></path>
                `;

                button.title = "Hide password";

            } else {

                password.type = "password";

                icon.innerHTML = `
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;

                button.title = "Show password";
            }
        }
    </script>

</body>
</html>
