```html
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customers - Smart Boutique</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3f0;
        }

        .header {
            background: #5b3a29;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            padding: 40px;
        }

        .page-title {
            color: #5b3a29;
            margin-bottom: 25px;
        }

        .search-box {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .search-box form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .search-box button {
            background: #5b3a29;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .search-box button:hover {
            background: #3f281d;
        }

        .search-box a {
            background: #777;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
        }

        .table-box {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #5b3a29;
            color: white;
        }

        tr:hover {
            background: #faf7f5;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

    </style>

</head>

<body>

    <div class="header">
        <h1>Smart Boutique</h1>
    </div>

    <div class="container">
        
        <h2 class="page-title">CUSTOMERS TEST 123</h2>

        <!-- Search Box -->
        <div class="search-box">

            <form method="GET">

                <input
                    type="text"
                    name="search"
                    placeholder="Search customer name, phone or email..."
                    value="{{ search }}"
                >

                <button type="submit">
                    🔎 Search
                </button>

                {% if search %}
                    <a href="{% url 'customer_list' %}">
                        Clear
                    </a>
                {% endif %}

            </form>

        </div>

        <!-- Customer Table -->
        <div class="table-box">

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Address</th>
                    </tr>
                </thead>

                <tbody>

                    {% for customer in customers %}

                    <tr>
                        <td>{{ customer.name }}</td>
                        <td>{{ customer.phone }}</td>
                        <td>{{ customer.email }}</td>
                        <td>{{ customer.address }}</td>
                    </tr>

                    {% empty %}

                    <tr>
                        <td colspan="4" class="empty">
                            No customers found.
                        </td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</body>
</html>
```
