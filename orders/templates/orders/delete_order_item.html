<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Order Item - Smart Boutique</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3f0;
        }

        .header {
            background: #5b3a29;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            color: #b02a37;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            font-size: 16px;
            margin: 10px 0;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        button,
        .no-btn {
            width: 140px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
        }

        .yes-btn {
            background: #b02a37;
            color: white;
        }

        .yes-btn:hover {
            background: #8f202c;
        }

        .no-btn {
            background: #ddd;
            color: #333;
        }

        .no-btn:hover {
            background: #ccc;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Smart Boutique</h1>
</div>

<div class="container">

    <h2>Delete Order Item</h2>

    <p>
        Are you sure you want to delete this item?
    </p>

    <p>
        <strong>{{ item.product.name }}</strong>
    </p>

    <p>
        Quantity: {{ item.quantity }}
    </p>

    <p>
        Total: ₹{{ item.total }}
    </p>

    <form method="POST">
        {% csrf_token %}

        <div class="buttons">

            <button type="submit" class="yes-btn">
                Yes, Delete
            </button>

            <a href="{% url 'order_list' %}" class="no-btn">
                No
            </a>

        </div>
    </form>

</div>

</body>
</html>
