```
<div class="header">
    <h1>Smart Boutique</h1>
</div>

<div class="container">

    <h2>Add Order</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" onsubmit="return validateCustomer()">

        {% csrf_token %}

        <!-- CUSTOMER SEARCH -->

        <label>Customer Name</label>

        <div class="customer-box">

            <input
                type="text"
                id="customerSearch"
                name="customer_name"
                placeholder="Type customer name..."
                autocomplete="off"
                required
            >

            <div id="suggestions" class="suggestions">

                {% for customer in customers %}

                    <div
                        class="suggestion"
                        data-id="{{ customer.id }}"
                        data-name="{{ customer.name }}"
                        data-phone="{{ customer.phone }}"
                    >

                        <div class="customer-name">
                            {{ customer.name }}
                        </div>

                        <div class="customer-phone">
                            {{ customer.phone }}
                        </div>

                    </div>

                {% endfor %}

            </div>

        </div>

        <!-- EXISTING CUSTOMER ID -->

        <input
            type="hidden"
            name="customer"
            id="customerId"
        >

        <!-- NEW CUSTOMER -->

        <button
            type="button"
            class="new-btn"
            onclick="showNewCustomer()"
        >
            + Add New Customer
        </button>

        <div id="newCustomerBox" class="new-customer">

            <h3>New Customer</h3>

            <label>Phone Number</label>

            <input
                type="text"
                name="new_customer_phone"
                id="newCustomerPhone"
                placeholder="Enter phone number"
            >

        </div>

        <!-- DESCRIPTION -->

        <label>Description</label>

        <textarea
            name="description"
            placeholder="Enter order details"
        ></textarea>

        <!-- TOTAL AMOUNT -->

        <label>Total Amount</label>

        <input
            type="number"
            name="total_amount"
            step="0.01"
            min="0"
            placeholder="Enter amount"
            required
        >

        <!-- STATUS -->

        <label>Status</label>

        <select name="status" required>

            <option value="Pending">Pending</option>
            <option value="Processing">Processing</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>

        </select>
        <center>

        <button type="submit">
            Save Order
        </button>
        </center>

    </form>

    <a href="{% url 'order_list' %}" class="back">
        ← Back to Orders
    </a>

</div>


<script>

    const searchInput =
        document.getElementById("customerSearch");

    const customerId =
        document.getElementById("customerId");

    const suggestions =
        document.getElementById("suggestions");

    const allCustomers =
        document.querySelectorAll(".suggestion");


    /* SEARCH CUSTOMER */

    searchInput.addEventListener("input", function () {

        const searchText =
            this.value.toLowerCase().trim();

        customerId.value = "";

        if (searchText === "") {

            suggestions.style.display = "none";

            return;
        }

        let found = false;

        allCustomers.forEach(function (customer) {

            const name =
                customer.dataset.name.toLowerCase();

            const phone =
                customer.dataset.phone.toLowerCase();

            if (
                name.includes(searchText) ||
                phone.includes(searchText)
            ) {

                customer.style.display = "block";

                found = true;

            } else {

                customer.style.display = "none";

            }

        });

        suggestions.style.display =
            found ? "block" : "none";

    });


    /* SELECT CUSTOMER */

    allCustomers.forEach(function (customer) {

        customer.addEventListener("click", function () {

            searchInput.value =
                this.dataset.name;

            customerId.value =
                this.dataset.id;

            suggestions.style.display = "none";

        });

    });


    /* SHOW NEW CUSTOMER */

    function showNewCustomer() {

        const box =
            document.getElementById("newCustomerBox");

        box.style.display = "block";

        customerId.value = "";

        searchInput.value = "";

        searchInput.focus();

    }


    /* VALIDATE */

    function validateCustomer() {

        const typedName =
            searchInput.value.trim().toLowerCase();


        /* If existing customer already selected */

        if (customerId.value !== "") {

            return true;

        }


        /* Check exact customer name */

        let exactCustomer = null;

        allCustomers.forEach(function (customer) {

            const name =
                customer.dataset.name.trim().toLowerCase();

            if (name === typedName) {

                exactCustomer = customer;

            }

        });


        /* Automatically select exact name */

        if (exactCustomer) {

            customerId.value =
                exactCustomer.dataset.id;

            return true;

        }


        /* New customer */

        const phone =
            document.getElementById("newCustomerPhone").value.trim();

        if (typedName !== "" && phone !== "") {

            return true;

        }


        alert(
            "Please select an existing customer or enter phone number for a new customer."
        );

        searchInput.focus();

        return false;

    }


    /* CLOSE SUGGESTIONS */

    document.addEventListener("click", function (event) {

        if (!event.target.closest(".customer-box")) {

            suggestions.style.display = "none";

        }

    });

</script>
