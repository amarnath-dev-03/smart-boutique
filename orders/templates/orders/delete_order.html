```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Order - Smart Boutique</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f3f0;
            color: #3b2a21;
        }

        /* HEADER */

        .header {
            background: #211c19;
            padding: 19px 35px;
        }

        .brand {
            color: #e7c98a;
            font-size: 25px;
            font-weight: bold;
        }

        .subtitle {
            color: #d8d8d8;
            font-size: 13px;
            margin-top: 4px;
        }

        /* MAIN */

        .container {
            width: 92%;
            max-width: 620px;
            margin: 65px auto;
        }

        /* CARD */

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.12);
        }

        .card-header {
            background: #5b3a29;
            color: white;
            text-align: center;
            padding: 28px 25px;
        }

        .warning-icon {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .card-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .card-header p {
            margin: 7px 0 0;
            color: #e7c98a;
            font-size: 13px;
        }

        /* CONTENT */

        .content {
            padding: 32px;
            text-align: center;
        }

        .question {
            color: #554941;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        /* ORDER BOX */

        .order-box {
            background: #f7f3f0;
            border: 1px solid #e5d9d1;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .order-label {
            color: #777;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        .order-id {
            color: #5b3a29;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .customer {
            color: #62554d;
            font-size: 14px;
        }

        .warning {
            color: #8b3a32;
            font-size: 13px;
            margin-bottom: 28px;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            gap: 12px;
        }

        .delete-btn,
        .cancel-btn {
            flex: 1;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
        }

        .delete-btn {
            background: #8b3a32;
            color: white;
            border: none;
        }

        .delete-btn:hover {
            background: #6f2d27;
        }

        .cancel-btn {
            background: #e7c98a;
            color: #3f281d;
        }

        .cancel-btn:hover {
            opacity: 0.88;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .header {
                padding: 17px 20px;
            }

            .brand {
                font-size: 21px;
            }

            .container {
                width: 94%;
                margin: 35px auto;
            }

            .content {
                padding: 25px 20px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <div class="brand">
        Smart Boutique
    </div>

    <div class="subtitle">
        Smart Tailoring & Boutique
    </div>

</div>


<!-- MAIN -->

<div class="container">


    <div class="card">


        <!-- CARD HEADER -->

        <div class="card-header">

            <div class="warning-icon">
                ⚠
            </div>

            <h1>
                Delete Order
            </h1>

            <p>
                Please confirm this action
            </p>

        </div>


        <!-- CONTENT -->

        <div class="content">

            <div class="question">
                Are you sure you want to delete this order?
            </div>


            <!-- ORDER DETAILS -->

            <div class="order-box">

                <div class="order-label">
                    Order
                </div>

                <div class="order-id">
                    #{{ order.id }}
                </div>

                <div class="customer">
                    Customer: <strong>{{ order.customer.name }}</strong>
                </div>

            </div>


            <div class="warning">
                This action cannot be undone.
            </div>


            <!-- BUTTONS -->

            <form method="POST">

                {% csrf_token %}

                <div class="buttons">

                    <button
                        type="submit"
                        class="delete-btn"
                    >
                        🗑 Yes, Delete
                    </button>

                    <a
                        href="{% url 'order_list' %}"
                        class="cancel-btn"
                    >
                        ← No, Go Back
                    </a>

                </div>

            </form>

        </div>


    </div>


</div>


</body>

</html>
```
