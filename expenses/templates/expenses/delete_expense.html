<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Expense - Smart Boutique</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3f0;
            color: #3b2a21;
        }

        /* HEADER */

        .header {
            background: #211c19;
            color: white;
            padding: 18px 35px;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: #e7c98a;
        }

        .subtitle {
            margin-top: 4px;
            font-size: 13px;
            color: #d8d8d8;
        }

        /* MAIN */

        .container {
            width: 92%;
            max-width: 620px;
            margin: 70px auto;
        }

        /* CARD */

        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.11);
            overflow: hidden;
        }

        .card-header {
            background: #5b3a29;
            color: white;
            padding: 24px 28px;
            text-align: center;
        }

        .warning-icon {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .card-header h1 {
            margin: 0;
            font-size: 25px;
        }

        .card-header p {
            margin: 7px 0 0;
            color: #e7c98a;
            font-size: 13px;
        }

        /* CONTENT */

        .content {
            padding: 32px;
            text-align: center;
        }

        .message {
            color: #62554d;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .expense-box {
            background: #f7f3f0;
            border: 1px solid #eadfd7;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .expense-title {
            color: #5b3a29;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .expense-amount {
            color: #8b3a32;
            font-size: 22px;
            font-weight: bold;
        }

        .warning-text {
            color: #8b3a32;
            font-size: 13px;
            margin-bottom: 28px;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            gap: 12px;
        }

        .yes-btn,
        .no-btn {
            flex: 1;
            padding: 13px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: 0.2s;
        }

        .yes-btn {
            background: #8b3a32;
            color: white;
            border: none;
        }

        .yes-btn:hover {
            background: #6f2d27;
        }

        .no-btn {
            background: #e7c98a;
            color: #3f281d;
        }

        .no-btn:hover {
            opacity: 0.85;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .header {
                padding: 16px 20px;
            }

            .brand {
                font-size: 21px;
            }

            .container {
                width: 94%;
                margin: 35px auto;
            }

            .content {
                padding: 25px 20px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <div class="brand">
        Smart Boutique
    </div>

    <div class="subtitle">
        Smart Tailoring & Boutique
    </div>

</div>


<!-- MAIN -->

<div class="container">


    <div class="card">


        <!-- HEADER -->

        <div class="card-header">

            <div class="warning-icon">
                ⚠
            </div>

            <h1>
                Delete Expense
            </h1>

            <p>
                Please confirm this action
            </p>

        </div>


        <!-- CONTENT -->

        <div class="content">

            <div class="message">
                Are you sure you want to delete this expense?
            </div>


            <div class="expense-box">

                <div class="expense-title">
                    {{ expense.title }}
                </div>

                <div class="expense-amount">
                    ₹{{ expense.amount }}
                </div>

            </div>


            <div class="warning-text">
                This action cannot be undone.
            </div>


            <!-- BUTTONS -->

            <form method="POST">

                {% csrf_token %}

                <div class="buttons">

                    <button
                        type="submit"
                        class="yes-btn"
                    >
                        🗑 Yes, Delete
                    </button>

                    <a
                        href="{% url 'expense_list' %}"
                        class="no-btn"
                    >
                        ← No, Go Back
                    </a>

                </div>

            </form>

        </div>


    </div>


</div>


</body>

</html>
